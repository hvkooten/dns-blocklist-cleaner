# This workflow will build, test and publish a WinForms desktop application built on .NET.
# It restores, runs unit tests, publishes the app with 'dotnet publish' and uploads the
# published output as a build artifact.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions

name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: DNS-BlockList-Cleaner.slnx                                          # Replace with your solution name, i.e. MyWpfApp.sln.
      Test_Project_Path: DNS-BlockList-Cleaner.Tests\DNS-BlockList-Cleaner.Tests.csproj  # Replace with the path to your test project, i.e. MyWpfApp.Tests\MyWpfApp.Tests.csproj.
      App_Project_Path: DNS-BlockList-Cleaner\DNS-BlockList-Cleaner.csproj               # Replace with the path to your application project.

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # Install the .NET workload
    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore $env:Solution_Name

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore

    # Publish the application (self-contained, single-file)
    - name: Publish the application
      if: matrix.configuration == 'Release'
      run: dotnet publish $env:App_Project_Path --configuration ${{ matrix.configuration }} --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output publish

    # Upload the published output: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: DNS-BlockList-Cleaner-${{ matrix.configuration }}
        path: publish

  # Create a GitHub Release with the published executable when a version tag is pushed.
  # Tags ending in ".0" (e.g. v1.1.0 minor, v2.0.0 major) are published as stable releases;
  # any other tag (e.g. v1.0.1 patch) is published as a pre-release (beta).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      App_Project_Path: DNS-BlockList-Cleaner\DNS-BlockList-Cleaner.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Publish the release build (self-contained, single-file)
    - name: Publish the application
      run: dotnet publish $env:App_Project_Path --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output publish

    # Rename the executable so the release asset carries the version tag
    - name: Package release asset
      run: |
        $version = "${{ github.ref_name }}"
        Copy-Item -Path publish\DNS-BlockList-Cleaner.exe -Destination "DNS-BlockList-Cleaner-$version-win-x64.exe"

    # Create the GitHub Release and attach the executable
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        prerelease: ${{ !endsWith(github.ref_name, '.0') }}
        generate_release_notes: true
        files: DNS-BlockList-Cleaner-${{ github.ref_name }}-win-x64.exe
